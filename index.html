
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123b70">
  <title>VisitDesk | Visitor Management</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5fb;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px 25px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 18px;
      border-radius: 18px;
      background: #123b70;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
    }

    h1 {
      color: #123b70;
      margin-bottom: 10px;
    }

    p {
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 13px;
      border-radius: 9px;
      text-decoration: none;
      font-weight: bold;
    }

    .primary {
      background: #123b70;
      color: white;
    }

    .secondary {
      background: #e8eef7;
      color: #123b70;
    }

    .note {
      font-size: 12px;
      margin-top: 25px;
      margin-bottom: 0;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">V</div>

    <h1>Welcome to VisitDesk</h1>

    <p>
      A simple and convenient visitor appointment
      management system. Submit your appointment
      request using the VisitDesk application.
    </p>

    <a class="button primary"
       href="visitdesk://visitor">
      Open VisitDesk
    </a>

    <a class="button secondary"
       href="https://github.com/18-pragadeesh/visitdesk-demo/releases/latest">
      Download VisitDesk App
    </a>

    <p class="note">
      Please install VisitDesk to submit your visitor appointment request.
    </p>
  </main>
</body>
</html>
